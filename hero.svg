<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sanchita Sabat — Backend, Full-Stack and AI/ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e16"/>
      <stop offset="0.55" stop-color="#0f1320"/>
      <stop offset="1" stop-color="#14182b"/>
    </linearGradient>

    <radialGradient id="glowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9e64" stop-opacity="0.40"/>
      <stop offset="0.6" stop-color="#e0af68" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#e0af68" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sun" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe6b8"/>
      <stop offset="0.45" stop-color="#ffce8a"/>
      <stop offset="1" stop-color="#ff9e64"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" spreadMethod="reflect">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset="0.35" stop-color="#7aa2f7"/>
      <stop offset="0.7" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#ffb085"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0; 0.4 0; -0.4 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>

    <style>
      .sans { font-family: "Segoe UI", "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Fira Code", "SFMono-Regular", Consolas, monospace; }

      .role { opacity: 0; }
      .r1 { animation: cycle 9s ease-in-out infinite; }
      .r2 { animation: cycle 9s ease-in-out infinite; animation-delay: 3s; }
      .r3 { animation: cycle 9s ease-in-out infinite; animation-delay: 6s; }
      @keyframes cycle {
        0%   { opacity: 0; }
        4%   { opacity: 1; }
        29%  { opacity: 1; }
        34%  { opacity: 0; }
        100% { opacity: 0; }
      }

      .caret { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

      .twinkle { animation: tw 3.4s ease-in-out infinite; }
      .d1 { animation-delay: 0s; }   .d2 { animation-delay: .5s; }
      .d3 { animation-delay: 1.1s; } .d4 { animation-delay: 1.7s; }
      .d5 { animation-delay: 2.3s; } .d6 { animation-delay: 2.9s; }
      @keyframes tw { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

      .float { animation: fl 6s ease-in-out infinite; }
      .f2 { animation-delay: 1.5s; } .f3 { animation-delay: 3s; } .f4 { animation-delay: 4.5s; }
      @keyframes fl { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }

      .breathe { animation: br 7s ease-in-out infinite; transform-origin: 985px 132px; }
      @keyframes br { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.06); opacity: 1; } }
    </style>
  </defs>

  <!-- Card -->
  <rect x="2" y="2" width="1196" height="356" rx="26" fill="url(#bg)" stroke="#23304d" stroke-width="1.5"/>

  <!-- Ambient glows -->
  <circle cx="160" cy="40" r="240" fill="url(#glowCool)"/>
  <circle cx="985" cy="132" r="230" fill="url(#glowWarm)"/>

  <!-- Cozy sunrise orb (right) -->
  <g class="breathe">
    <circle cx="985" cy="132" r="92" fill="url(#glowWarm)"/>
    <circle cx="985" cy="132" r="48" fill="url(#sun)"/>
  </g>
  <!-- orbit ring + travelling dot (airport / sky nod to AeroFocus) -->
  <ellipse cx="985" cy="132" rx="138" ry="58" fill="none" stroke="#7aa2f7" stroke-opacity="0.25" stroke-width="1.5"/>
  <g>
    <circle cx="985" cy="74" r="4.5" fill="#7dcfff"/>
    <animateTransform attributeName="transform" type="rotate" from="0 985 132" to="360 985 132" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- Stars -->
  <circle class="twinkle d1" cx="900" cy="60"  r="2"   fill="#c0caf5"/>
  <circle class="twinkle d2" cx="1080" cy="80" r="1.6" fill="#bb9af7"/>
  <circle class="twinkle d3" cx="1120" cy="200" r="2.2" fill="#7dcfff"/>
  <circle class="twinkle d4" cx="850" cy="230" r="1.8" fill="#c0caf5"/>
  <circle class="twinkle d5" cx="1060" cy="270" r="2"   fill="#ff9e64"/>
  <circle class="twinkle d6" cx="940" cy="295" r="1.6" fill="#c0caf5"/>

  <!-- Floating accent dots (left) -->
  <circle class="float"    cx="60"  cy="300" r="3" fill="#7aa2f7" opacity="0.6"/>
  <circle class="float f2" cx="430" cy="70"  r="2.5" fill="#bb9af7" opacity="0.6"/>
  <circle class="float f3" cx="700" cy="300" r="3" fill="#7dcfff" opacity="0.5"/>
  <circle class="float f4" cx="640" cy="60"  r="2.5" fill="#ff9e64" opacity="0.6"/>

  <!-- ===== Text block (left) ===== -->
  <text x="70" y="96" class="mono" font-size="18" fill="#9ece6a">const</text>
  <text x="128" y="96" class="mono" font-size="18" fill="#9aa5ce">engineer =</text>

  <!-- Name -->
  <text x="68" y="168" class="sans" font-size="72" font-weight="800" fill="url(#nameGrad)" letter-spacing="0.5">Sanchita Sabat</text>

  <!-- Terminal role line -->
  <text x="70" y="222" class="mono" font-size="26" fill="#565f89">&gt;</text>
  <rect class="caret" x="96" y="201" width="13" height="26" rx="2" fill="#7dcfff"/>
  <g class="mono" font-size="26" font-weight="600">
    <text class="role r1" x="120" y="222" fill="#c0caf5">Backend Engineer</text>
    <text class="role r2" x="120" y="222" fill="#c0caf5">Full-Stack Developer</text>
    <text class="role r3" x="120" y="222" fill="#c0caf5">AI / ML Engineer</text>
  </g>

  <!-- Sub line -->
  <text x="70" y="258" class="sans" font-size="17" fill="#828bb8">B.Tech CSE &#8217;27  &#183;  Manipal University Jaipur  &#183;  Bharat &#127470;&#127475;</text>

  <!-- Accent rule -->
  <rect x="70" y="276" width="300" height="2.5" rx="1.25" fill="url(#rule)"/>

  <!-- Pills -->
  <g class="sans" font-size="14.5" font-weight="600">
    <g>
      <rect x="70" y="296" width="156" height="34" rx="17" fill="#16203a" stroke="#bb9af7" stroke-opacity="0.45"/>
      <circle cx="90" cy="313" r="4" fill="#bb9af7"/>
      <text x="102" y="318" fill="#cbb8ff">IEEE Published</text>
    </g>
    <g>
      <rect x="238" y="296" width="150" height="34" rx="17" fill="#16203a" stroke="#ff9e64" stroke-opacity="0.45"/>
      <circle cx="258" cy="313" r="4" fill="#ff9e64"/>
      <text x="270" y="318" fill="#ffc69a">AWS Certified</text>
    </g>
    <g>
      <rect x="400" y="296" width="196" height="34" rx="17" fill="#16203a" stroke="#9ece6a" stroke-opacity="0.5"/>
      <circle cx="420" cy="313" r="4" fill="#9ece6a"/>
      <text x="432" y="318" fill="#b7e08e">Open to Internships</text>
    </g>
  </g>
</svg>
